[project]
name = "studyforge-rag-agent"
version = "0.1.0"
description = "StudyForge AI rag_agent: provider adapters, ingestion, hybrid retrieval and grounded chat workflows"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.13",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "openai>=2.0,<3",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
